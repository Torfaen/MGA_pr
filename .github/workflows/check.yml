name: check

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "**.py"
  workflow_dispatch:

jobs:
  resource:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install maafw
        run: |
            python -m pip install --upgrade pip
            python -m pip install maafw==5.12.3

      - name: Check Resource
        run: |
            python ${{ github.workspace }}/tools/CI/check_resource.py ${{ github.workspace }}/assets/resource/
